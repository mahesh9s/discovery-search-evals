name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests, golden-set checks and the ship gates
        run: python -m pytest -q
      - name: Regenerate the results tables
        run: python -m evals.run
      - name: Post the dev-set summary to the run page
        run: cat results/dev/summary.md >> "$GITHUB_STEP_SUMMARY"
